name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Static checks, unit tests, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Ensure Android SDK packages
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null
          fi

      - name: Build and check
        run: ./gradlew --no-daemon spotlessCheck lintDebug testDebugUnitTest assembleDebug

      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-apk
          path: |
            app/build/reports/
            app/build/outputs/apk/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn

  emulator:
    name: Instrumented tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
        include:
          - api: 36
            visual: '1'
          - api: 30
            visual: '0'
    env:
      MORSEL_VISUAL: ${{ matrix.visual }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Ensure Android SDK packages
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null
          fi

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ONE script command: test status and evidence collection live in the
      # same shell process (scripts/ci-emulator.sh), so failing tests can
      # never report a green step.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          # A real phone profile: with no profile the AVD is 320x640@160dpi,
          # where the card's 320dp width EQUALS the display width and the
          # smaller-than-display / outside-tap geometry tests are unsatisfiable.
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-emulator.sh

      - name: Upload emulator reports, screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            connected-logcat.txt
            connected-logcat-phase1.txt
            connected-logcat-phase1-stream.log
            emulator-final.png
            instrument-*.log
            shots*.list
            morsel-screens/
            morsel-screens-host/
          if-no-files-found: warn
