name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Static checks, unit tests, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Ensure Android SDK packages
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null
          fi

      - name: Build and check
        run: ./gradlew --no-daemon spotlessCheck lintDebug testDebugUnitTest assembleDebug

      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-apk
          path: |
            app/build/reports/
            app/build/outputs/apk/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn
