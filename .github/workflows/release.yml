name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Full CI (static checks, unit tests, emulator API30+API36 incl. the
  # process-death phases) on the exact tagged commit. Signing never starts
  # unless every job in the called workflow passed.
  gates:
    name: Full CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Sign and publish prerelease
    needs: gates
    if: github.repository == 'evrenesat/morsel'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Ensure Android SDK packages
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null
          fi

      - name: Write signing key to runner temp
        env:
          MORSEL_KEYSTORE_BASE64: ${{ secrets.MORSEL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$MORSEL_KEYSTORE_BASE64" ]; then
            echo "MORSEL_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          printf '%s' "$MORSEL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/morsel-release.keystore"
          chmod 600 "$RUNNER_TEMP/morsel-release.keystore"

      - name: Build signed release APK
        env:
          MORSEL_STORE_FILE: ${{ runner.temp }}/morsel-release.keystore
          MORSEL_STORE_PASSWORD: ${{ secrets.MORSEL_STORE_PASSWORD }}
          MORSEL_KEY_ALIAS: ${{ secrets.MORSEL_KEY_ALIAS }}
          MORSEL_KEY_PASSWORD: ${{ secrets.MORSEL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature against pinned certificate
        env:
          MORSEL_CERT_SHA256: ${{ secrets.MORSEL_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$MORSEL_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Release certificate does not match MORSEL_CERT_SHA256" >&2
            exit 1
          fi
          echo "Certificate verified: $ACTUAL"

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/morsel-release.keystore"

      - name: Publish prerelease (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SUMS="app/build/outputs/apk/release/SHA256SUMS"
          NOTES="Signed prerelease built from the tested commit $GITHUB_SHA.
          CI on this exact commit: https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}
          Morsel is awaiting owner validation on a real feeder; no live Petlibro account or physical dispensing has been exercised. Verify before installing: bash scripts/verify-apk.sh <apk> <cert-sha256>."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$APK" "$SUMS"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "Morsel $GITHUB_REF_NAME" --notes "$NOTES" "$APK" "$SUMS"
          fi

  # Post-publication health check: download the EXACT published APK, verify
  # checksum/certificate/identity, then install and launch it on an emulator.
  # Any failure fails this workflow visibly.
  health-check:
    name: Verify published APK on emulator
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download published release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'app-release.apk' --pattern 'SHA256SUMS' --dir published
          ls -la published

      - name: Verify checksum, certificate and package identity
        env:
          MORSEL_CERT_SHA256: ${{ secrets.MORSEL_CERT_SHA256 }}
        run: |
          set -euo pipefail
          (cd published && sha256sum -c SHA256SUMS)
          bash scripts/verify-apk.sh published/app-release.apk "$MORSEL_CERT_SHA256"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch published APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/release-health-check.sh

      - name: Upload health-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-health-check
          path: |
            health-logcat.txt
            published-launch.png
          if-no-files-found: warn
